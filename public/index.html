<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw under the notch and home bar (safe-area insets handle the padding);
         maximum-scale=1 stops iPhone Safari from zooming in when a text field gets focus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Ghi chép thu chi cá nhân, dữ liệu lưu ngay trên máy của bạn." />

    <!-- Installable app ("Thêm vào Màn hình chính" on iPhone) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chi Tiêu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* No rubber-band bounce of the whole page; lists still scroll. */
        overscroll-behavior: none;
        background-color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      /* Phones: no browser focus ring around text fields; the native app has none either. */
      @media (pointer: coarse) {
        input,
        textarea {
          outline: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #000000;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        /* Follows the visible area while the keyboard is open (see the script below). */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
      }
    </style>
  </head>

  <body>
    <noscript>Bạn cần bật JavaScript để dùng Chi Tiêu.</noscript>
    <div id="root"></div>
    <script>
      // Offline support, except on the Metro dev server where caching would serve stale code.
      if ('serviceWorker' in navigator && location.port !== '8081') {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
      // Ask the browser not to clear the app's data (the database lives in site storage).
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      // When the on-screen keyboard opens, phones shrink only the visual viewport and pan it
      // to the focused field, which left the app's header (or the whole app) off screen. Pin the
      // app to the visible area instead, like a native app; src/lib/keyboard.web.ts then scrolls
      // the focused field into view.
      if (window.visualViewport) {
        const viewport = window.visualViewport;
        const root = document.getElementById('root');
        const fit = () => {
          if (viewport.scale > 1.01) return; // pinch-zoomed: leave the page alone
          root.style.top = viewport.offsetTop + 'px';
          root.style.height = viewport.height + 'px';
        };
        viewport.addEventListener('resize', fit);
        viewport.addEventListener('scroll', fit);
        fit();
      }
    </script>
  </body>
</html>
